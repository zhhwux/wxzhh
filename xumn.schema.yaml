#原码整句规则为：最短首选编码，1码字后加'后缀（分词符改为_）
__include: tiger.schema:/
schema:
  schema_id: xumn
  name: 虎码原码整句

translator:
  dictionary: tiger
  prism: xumn
  enable_user_dict: false # 是否开启自动调频
  enable_completion: false # 提前显示尚未输入完整码的字
  initial_quality: 99

add_user_dict:
  prism: xumn
user_dict_set:
  prism: xumn

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA7890_;*/\'[]
  # initials 定义仅作为始码的按键，排除 ` 让单个的 ` 可以直接上屏
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA;\[]
  delimiter: " _"     
  #第一位<空格>是拼音之间的分隔符；第二位<_>表示可以手动输入下划线来分割拼音。
  auto_select: true
  auto_select_pattern: ^;\w+ #自动上屏规则  对 [;] 引导的编码实行候选唯一自动上屏
  algebra:
    - xform/[,￣0]//
    - xform/-.*$//

    - derive/[qwertyuiopasdfghjklzxcvbnm](.*)/*$1/
    - derive/(\w)[qwertyuiopasdfghjklzxcvbnm](\w)/$1*$2/
    - derive/(\w)(\w)[qwertyuiopasdfghjklzxcvbnm](\w)/$1$2*$3/
    - derive/(.*)[qwertyuiopasdfghjklzxcvbnm]/$1*/