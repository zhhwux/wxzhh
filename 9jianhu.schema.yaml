__include: tiger.schema:/
schema:
  schema_id: 9jianhu
  name: 九键虎

switches:
  - name: ascii_mode
    states: [ 中, 英 ]
  - name: chaifen        #拆分滤镜
    states: [ 隐, 拆 ]   
  - name: pinyin         #拼音滤镜
    states: [ 字, pīn ]
  - name: ascii_punct    #中英标点
    states: [ ¥, $ ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: udpf_switch
    states: [ 关, U编]

# 输入引擎
engine:
  processors:
    - lua_processor@*quick_symbol_text2   #快符引导以及重复上屏，配合quick_symbol_text顶层配置清单定义扩展按键
    - ascii_composer                       #处理英文模式及中英文切换
    - recognizer                           #与 matcher 搭配，处理符合特定规则的输入码，如网址、反查等 tags
    - key_binder                           #在特定条件下将按键绑定到其他按键，如重定义逗号、句号为候选翻页、开关快捷键等
    - lua_processor@*key_binder            #绑定按键扩展能力，支持正则扩展将按键生效情景更加细化
    - speller                              #拼写处理器，接受字符按键，编辑输入
    - punctuator                           #符号处理器，将单个字符按键直接映射为标点符号或文字
    - selector                             #选字处理器，处理数字选字键〔可以换成别的哦〕、上、下候选定位、换页
    - navigator                            #处理输入栏内的光标移动
    - express_editor                       #编辑器，处理空格、回车上屏、回退键
  segmentors:
    - ascii_segmentor                      #标识英文段落〔譬如在英文模式下〕字母直接上屛
    - matcher                              #配合 recognizer 标识符合特定规则的段落，如网址、反查等，加上特定 tag
    - abc_segmentor                        #标识常规的文字段落，加上 abc 这个 tag
    - affix_segmentor@add_user_dict       #虎码自造词加词 tag
    - punct_segmentor                      #标识符号段落〔键入标点符号用〕加上 punct 这个 tag
    - fallback_segmentor                   #标识其他未标识段落，必须放在最后帮助tag模式切换后回退重新处理
  translators:
    - punct_translator                     #配合 punct_segmentor 转换标点符号
    - script_translator                    #脚本翻译器，用于拼音、粤拼等基于音节表的输入方案
    - lua_translator@*shijian              #农历、日期、节气、节日、时间、周、问候模板等等，触发清单看下文
    - lua_translator@*unicode              #通过输入大写U引导，并输入Unicode编码获得汉字输出
    - lua_translator@*number_translator    #数字、金额大写，通过输入大写R1234获得候选输出
    - lua_translator@*super_calculator     #超级计算器，Lua内查看高级用法
    - script_translator@user_dict_set     #虎码自造词之使用词汇入口
    - script_translator@add_user_dict     #虎码自造词之制造词汇入口
  filters:
    - lua_filter@*common_filter                    #字符集过滤
    - lua_filter@*temporary_word                   #临时4码简词
    - lua_filter@*chaifen                          #拆分滤镜
    - simplifier@pinyin                            #拼音滤镜 
    - lua_filter@*unicode_display                  #Unicode编码显示
    - uniquifier                                    # 去重

translator:
  dictionary: 9jianhu
  enable_user_dict: false # 是否开启自动调频
  enable_completion: true # 提前显示尚未输入完整码的字
  initial_quality: 99

user_dict_set:
  dictionary: 9jianhu
  initial_quality: 0
  enable_completion: false
  enable_sentence: false
  core_word_length: 4          # >0 启用，按段学词 + 相邻段拼接
  max_word_length: 7           # >0 启用，过长短语不记整词，只加元素权重
  spelling_hints: 50
  comment_format:
  enable_user_dict: true
  user_dict: custom_phrase/zaoci
  db_class: tabledb 

add_user_dict:
  tag: add_user_dict
  dictionary: 9jianhu
  initial_quality: -1
  user_dict: custom_phrase/zaoci
  enable_completion: true # 提前显示尚未输入完整码的字〔仅 table_translator 有效〕
  enable_user_dict: true
  spelling_hints: 50
  #enable_auto_phrase: true    # lua造词功能，在custom开启，相关功能位于super_comment_preedit，开启后：模型能造的句子不造词，现有的词不造词，只造词库没有的，选词可造词
  comment_format:
  prefix: "`"
  tips: "〔自造词〕"

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`_;*/
  # initials 定义仅作为始码的按键，排除 ` 让单个的 ` 可以直接上屏
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA;
  delimiter: " '"     
  #第一位<空格>是拼音之间的分隔符；第二位<'>表示可以手动输入单引号来分割拼音。
  auto_select: true
  auto_select_pattern: ^;\w+ #自动上屏规则  对 [;] 引导的编码实行候选唯一自动上屏
  algebra:
  ################### 无重码的九键方案 ####################
    # 将词典文件中符合对应模式的汉字编码，通过“xform/”或“derive/”转换/派生成新的编码。
    # 所有四码：
    ## 前半部分: 使用xform/，转换，确保第三个码不参与编码，仅有【选择】的作用。
    - xform/([qadgjmptx][qadgjmptx])(\w\w)/$1Q$2/
    - xform/([qadgjmptx][wbehknruy])(\w\w)/$1A$2/
    - xform/([qadgjmptx][cfilosvz])(\w\w)/$1D$2/
    - xform/([wbehknruy][qadgjmptx])(\w\w)/$1G$2/
    - xform/([wbehknruy][wbehknruy])(\w\w)/$1J$2/
    - xform/([wbehknruy][cfilosvz])(\w\w)/$1M$2/
    - xform/([cfilosvz][qadgjmptx])(\w\w)/$1P$2/
    - xform/([cfilosvz][wbehknruy])(\w\w)/$1T$2/
    - xform/([cfilosvz][cfilosvz])(\w\w)/$1X$2/
    ## 后半部分：使用derive/，派生，确保打到第五码时，候选框有字，有意义。
    - xform/(\w\w\w)([qadgjmptx][qadgjmptx])/$1$2Q/
    - xform/(\w\w\w)([qadgjmptx][wbehknruy])/$1$2A/
    - xform/(\w\w\w)([qadgjmptx][cfilosvz])/$1$2D/
    - xform/(\w\w\w)([wbehknruy][qadgjmptx])/$1$2G/
    - xform/(\w\w\w)([wbehknruy][wbehknruy])/$1$2J/
    - xform/(\w\w\w)([wbehknruy][cfilosvz])/$1$2M/
    - xform/(\w\w\w)([cfilosvz][qadgjmptx])/$1$2P/
    - xform/(\w\w\w)([cfilosvz][wbehknruy])/$1$2T/
    - xform/(\w\w\w)([cfilosvz][cfilosvz])/$1$2X/
    # 所有三码：
    # ## 第3码：使用derive/，派生（此处有缺陷：派生后的码最后一位会混入四码的同位置编码，导致重码。）
    - xform/(\l\l)([qadgjmptx])/$1$2Q/
    - xform/(\l\l)([wbehknruy])/$1$2A/
    - xform/(\l\l)([cfilosvz])/$1$2D/

    ## 第3码：使用derive/，派生（用/*`代替，避免重码。
    ### 注意同步调整speller/alphabet，使其包含/*`符号）; 
    ### 注意同步speller/auto_select_pattern，增加[/*`]结尾编码的候选唯一自动上屏。
    # - derive/(\l\l)([qadgjmptx])/$1$2\x2F/  # \x2F为"/"的ASCII编码
    # - derive/(\l\l)([wbehknruy])/$1$2*/
    # - derive/(\l\l)([cfilosvz])/$1$2`/
    ## 前2码：使用xform/，转换
    - xform/([qadgjmptx][qadgjmptx])(\l)/$1Q$2/
    - xform/([qadgjmptx][wbehknruy])(\l)/$1A$2/
    - xform/([qadgjmptx][cfilosvz])(\l)/$1D$2/
    - xform/([wbehknruy][qadgjmptx])(\l)/$1G$2/
    - xform/([wbehknruy][wbehknruy])(\l)/$1J$2/
    - xform/([wbehknruy][cfilosvz])(\l)/$1M$2/
    - xform/([cfilosvz][qadgjmptx])(\l)/$1P$2/
    - xform/([cfilosvz][wbehknruy])(\l)/$1T$2/
    - xform/([cfilosvz][cfilosvz])(\l)/$1X$2/
    # 所有二码：
    ## 使用“derive/”，这样打到第二个码时，候选框有字，有意义。
    - xform/^([qadgjmptx][qadgjmptx])$/$1Q/
    - xform/^([qadgjmptx][wbehknruy])$/$1A/
    - xform/^([qadgjmptx][cfilosvz])$/$1D/
    - xform/^([wbehknruy][qadgjmptx])$/$1G/
    - xform/^([wbehknruy][wbehknruy])$/$1J/
    - xform/^([wbehknruy][cfilosvz])$/$1M/
    - xform/^([cfilosvz][qadgjmptx])$/$1P/
    - xform/^([cfilosvz][wbehknruy])$/$1T/
    - xform/^([cfilosvz][cfilosvz])$/$1X/

    # 所有一码：
    # ## 使用“derive/”，这样打到第一个码时，候选框有字，有意义。
    - xform/^([qadgjmptx])$/$1Q/
    - xform/^([wbehknruy])$/$1A/
    - xform/^([cfilosvz])$/$1D/
    ### 以上灵活使用“derive/”和“xform/”，可以确保候选框随时都有信息，不会存在无意义的空框。
      #同时让第三和第六码仅有选择的作用而不会扰乱原来的编码（如果使用derive的话，会导致第三和第六码增加重码）

    # 适配;引导的快符(只需派生一码即可，两码的快符派生后有三码，失去了快的意义)：
    # - derive/^(;[qadgjmptx])$/$1\x2Q/
    # - derive/^(;[wbehknruy])$/$1A/
    # - derive/^(;[cfilosvz])$/$1D/

    # 将大写字母转换成小写字母
    - xlit/QWERTYQIOPATDFGHJKLZXCVBNM/qwertyqiopatdfghjklzxcvbnm/
    ################### /无重码的九键方案 ####################

  ################### 适配九键布局 ###################
    # （表达式参考自【仓*九宫格】方案的T9拼音穷举）
    # 相比使用“xlit/”, “derive/”可以兼容原字母键盘，使得字母键盘和九键键盘可以同时使用。
    - xform/[abc]/a/  # 这里用@代替2，保留数字2的选择功能，方便后续设置分号二选。
    - xform/[def]/d/  # 这里用#代替3，保留数字3的选择功能，方便后续设置单引号三选。
    - xform/[ghi]/g/
    - xform/[jkl]/j/
    - xform/[mno]/m/
    - xform/[prs]/p/
    - xform/[tuv]/t/
    - xform/[xyz]/x/
    - xform/[qw]/q/  # 和传统九宫格不同，这里将1键映射到 q 和 w。
    ################# /适配九键布局 ###################

    # 下面这行代码是“derive/”的替代方案，缺点是它会使电脑上的字母键盘无法打中文字，但可以打英文字母。
    # - xlit/qwabcdefghijklmnoprstuvxyz/11222333444555666777888999/

    - derive/[qwertyuiopasdfghjklzxcvbnm](.*)/*$1/
    - derive/(\w)[qwertyuiopasdfghjklzxcvbnm](\w)/$1*$2/
    - derive/(\w)(\w)[qwertyuiopasdfghjklzxcvbnm](\w)/$1$2*$3/
    - derive/(.*)[qwertyuiopasdfghjklzxcvbnm]/$1*/