schema:
  schema_id: tiger
  name: 万象虎
  dependencies:
    - tiger_en
    - tiger_lookup 
    - tigress

switches:
  - name: english_word   #中英单词
    states: [ 中, 英 ]
  - name: chaifen        #拆分滤镜
    states: [ 隐, 拆 ]   
  - name: pinyin         #拼音滤镜
    states: [ 字, pīn ]
  - name: charset_filter  #常用字滤镜
    states: [ 全, 常 ]
    reset: 1
  - name: sentence
    states: [ 关, 虎句 ]
    reset: 1   
  - name: word
    states: [ 关, 虎词 ]
    reset: 1   
  - name: char
    states: [ 关, 虎单 ]
    reset: 1
  - name: yin
    states: [ 关, 音码 ]
  - name: completion
    states: [ 关, 提示 ]
  - name: super_tips
    states: [ off, tips ]
  - options: [ chongma_on, chongma_off, tishi_off]
    states: [ 重码开, 重码关, 提示关]
  - name: tone_display
    states: [ 关, 句pīn ] 
  - options: [ comment_off, fuzhu_hint]  #拼音辅助码滤镜
    states: [ 注关, 辅开]
  - name: chaifen_switch               #开启后在候选的注释里面实时显示辅助码的拆分提醒优先级高于普通辅助提醒，不开启则采用系统配置，快捷键配套ctrl+c,影响的是comment_format，归属：super_comment.lua
    states: [ 拆分关, 拆分开 ]
  - name: ascii_punct    #中英标点
    states: [ ¥, $ ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - options: [ s2s, s2t, s2hk, s2tw ]
    states: [ 简体, 通繁, 港繁, 臺繁 ]
  - name: emoji
    states: [ 🙃, 😄 ]
  - name: udpf_switch
    states: [ 关, U编]
  - name: chinese_english
    states: [ 关, 翻译 ]

# 移动端性能优化轻量引擎（保留拼音反查、拆分提示与重复上屏）
engine:
  processors:
    - lua_processor@*quick_symbol_text2   # 快符引导以及重复上屏（双击单引号）
    - ascii_composer                       # 处理英文模式及中英文切换
    - recognizer                           # 处理网址、反查等 tags
    - key_binder                           # 快捷键绑定
    - speller                              # 拼写处理器
    - punctuator                           # 符号处理器
    - selector                             # 选字处理器
    - navigator                            # 光标移动
    - express_editor                       # 编辑器
  segmentors:
    - ascii_segmentor                      # 英文段落
    - matcher                              # 匹配 recognizer
    - abc_segmentor                        # 常规文字段落
    - affix_segmentor@yin_add_user        # 拼音反查 tag（' 或 `）
    - affix_segmentor@add_user_dict        # 虎码自造词加词 tag
    - punct_segmentor                      # 符号段落
    - fallback_segmentor                   # 回退处理
  translators:
    - punct_translator                     # 标点符号
    - lua_translator@*switch_translator    # 虎单、虎词（提供一简字、简词，受char/word开关控制）
    - script_translator                    # 虎码主翻译器
    - table_translator@tiger_en            # 虎码/英文混合
    - script_translator@yin_add_user       # 拼音反查入口（'前缀或`后缀）
    - script_translator@user_dict_set      # 虎码自造词之使用词汇入口
    - script_translator@add_user_dict      # 虎码自造词之制造词汇入口
    - history_translator@historySJ         # 手机按键重复上屏（按 z）
  filters:
    - lua_filter@*temporary_word           # 临时4码简词
    - lua_filter@*chaifen                  # 拆分滤镜
    - simplifier@pinyin                    # 拼音滤镜
    - lua_filter@*unicode_display          # Unicode 编码显示
    - lua_filter@*switch_filter            # 开关滤镜
    - uniquifier                           # 去重

# 关闭 303MB 庞大语法模型，消除手机端整句 Viterbi DP 繁重运算与内存消耗
grammar:
  language: ""

# 拼音反查（'前缀 或 `后缀）
yin_add_user:
  tag: yin_add_user
  dictionary: wanxiang_pro
  initial_quality: -1
  user_dict: zc
  enable_completion: true
  enable_user_dict: true
  spelling_hints: 50
  prefix: "'"
  suffix: "`"
  tips: "〔音〕"

# 手机重复上屏（输入 z 重复上屏）
historySJ:
  input: z
  size: 3
  initial_quality: 99

recognizer:
  patterns:
    yin_add_user: "^[A-Za-z']*`$|^'[A-Za-z']*$"
    add_user_dict: "^`[A-Za-z']*$"
    semicolon: ";;"

# 拼音滤镜配置
pinyin:
  opencc_config: pinyin.json
  option_name: pinyin
  show_in_comment: true
  comment_format:
    - "xform/&nbsp;/ /"
    - "xform/（/ /"
    - "xform/）/ /"
  tips: all

key_binder:
  bindings:
    - { when: has_menu, accept: semicolon, send: 2 }
    - { when: has_menu, accept: "Control+m", toggle: english_word }
    - { when: has_menu, accept: "Control+q", toggle: yin }
    - { when: has_menu, accept: "Control+y", toggle: pinyin }
    - { when: has_menu, accept: "Control+z", toggle: chaifen }
    - { when: has_menu, accept: "Control+r", toggle: completion }
    - { when: has_menu, accept: "Control+a", toggle: sentence }
    - { when: has_menu, accept: "Control+s", toggle: word }
    - { when: has_menu, accept: "Control+d", toggle: char }

translator:
  dictionary: tiger
  prism: wxh
  enable_user_dict: false # 是否开启自动调频
  enable_completion: false
  initial_quality: 99

# 拼音混输
yin_engine:
  dictionary: wanxiang_pro

# 虎码造词使用
user_dict_set:
  dictionary: tiger
  prism: wxh
  initial_quality: 0
  enable_completion: false
  enable_sentence: false
  core_word_length: 4          # >0 启用，按段学词 + 相邻段拼接
  max_word_length: 7           # >0 启用，过长短语不记整词，只加元素权重
  spelling_hints: 50
  comment_format:
  enable_user_dict: true
  user_dict: custom_phrase/zaoci
  db_class: tabledb

add_user_dict:
  user_dict: custom_phrase/zaoci

# 虎码、英文混合词汇
tiger_en:
  dictionary: tiger_en
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 2
  comment_format:
    - xform/^.+$//

custom_phrase:
  dictionary: ""
  user_dict: ""
chengyu:
  dictionary: ""
  user_dict: ""
wanxiang_english:
  dictionary: ""
  user_dict: ""
wanxiang_mixedcode:
  dictionary: ""

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA7890;*/\[]
  # initials 定义仅作为始码的按键，排除 ` 让单个的 ` 可以直接上屏
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA;\[]
  delimiter: " '"     
  #第一位<空格>是拼音之间的分隔符；第二位<'>表示可以手动输入单引号来分割拼音。
  auto_select: true
  auto_select_pattern: ^;\w+ #自动上屏规则  对 [;] 引导的编码实行候选唯一自动上屏
  algebra:
    - xform/[-￣]//
    - derive/^(\w)(\w),(\w)(\w)$/$1$2/ # 纯双拼的情况
    - derive/^(\w)(\w),(\w)(\w)$/$1$2$3/ # 双拼+一位辅助码的情况
    - derive|^(\w)(\w),(\w)(\w)$|$1$2$3$4/| # 双拼+2位辅助码的情况 结尾加/
 
    - derive/[qwertyuiopasdfghjklzxcvbnm](.*)/*$1/
    - derive/(\w)[qwertyuiopasdfghjklzxcvbnm](\w)/$1*$2/
    - derive/(\w)(\w)[qwertyuiopasdfghjklzxcvbnm](\w)/$1$2*$3/
    - derive/(.*)[qwertyuiopasdfghjklzxcvbnm]/$1*/

# 虎单、虎词
char_word:
  dictionary: tigress
  user_dict: custom_phrase/user
  db_class: stabledb
  enable_completion: false # 补全提示
  enable_sentence: false   
  initial_quality: 9999
  four_auto_commit: true   # 4码唯一自动上屏
  four_auto_clear: false   # 4码空码自动清屏
  five_commit_four: true   # 5码顶屏
  
enum:
  chaifen: all     # 2种选择， char|all 只显示单字拆分|完全拆分
  jianci: 1230    # 2种选择， 1230|1234 四字以上造词规则：取前3字+末字首码|取前4字首码

punctuator:
  digit_separators: ":,."
  half_shape:
    ",": "，"
    ".": "。"
    "<": "《"
    ">": "》"
    "/": "、"
    "?": "？"
    ";": "；"
    ":": "："
    "!": "！"
    '"': { pair: [ '“', '”' ] }
    "'": { pair: [ '‘', '’' ] }
    "(": "（"
    ")": "）"
    "[": "【"
    "]": "】"
    "{": "「"
    "}": "」"
    "_": "——"
    "~": "～"
    "\\": "、"
    "$": "￥"
    "^": "……"
    "`": "`"
    "*": "·"
    "=": "="
    "+": "+"
    "-": "-"
  full_shape:
    " ": { commit: "　" }
    ",": { commit: "，" }
    ".": { commit: "。" }
    "?": { commit: "？" }
    "!": { commit: "！" }
    ":": { commit: "：" }
    ";": { commit: "；" }
